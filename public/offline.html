<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ziad ❤️ Habiba — أنتِ غير متصلة بالإنترنت</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;
    }
    body {
      background-color: #F2E1DD;
      color: #795C53;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background-color: #FFF9F2;
      border-radius: 28px;
      padding: 40px 24px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 15px 35px -5px rgba(121, 92, 83, 0.12);
      border: 1px solid rgba(216, 174, 135, 0.3);
    }
    .heart-icon {
      font-size: 50px;
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #795C53;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #9A7A70;
      margin-bottom: 24px;
    }
    .retry-btn {
      background-color: #F3CED0;
      color: #795C53;
      border: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(216, 140, 136, 0.25);
      transition: all 0.2s ease;
    }
    .retry-btn:hover {
      background-color: #EBBEC1;
      transform: scale(1.03);
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart-icon">💌</div>
    <h1>أنتِ غير متصلة بالإنترنت</h1>
    <p>يبدو أن شبكة الإنترنت مقطوعة حالياً، لكن مكاننا محفوظ دايماً في القلب ❤️</p>
    <button class="retry-btn" onclick="window.location.reload()">
      إعادة المحاولة 🔄
    </button>
  </div>
</body>
</html>
